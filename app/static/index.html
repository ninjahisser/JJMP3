<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JJMP3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1a17'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23f1ede4' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23c4472b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><h1>JJMP3</h1><span class="mono">pocket player</span></div>
    <div class="module" title="Live view of the player's screen">
      <div class="glass"><img id="oled" alt="" hidden><div class="off" id="oled-off">not connected</div></div>
      <div class="pins"><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="conn" id="conn"></div>
    <nav id="nav">
      <a href="#/library" data-page="library"><span>Library</span><span class="mono" id="nav-lib"></span></a>
      <a href="#/playlists" data-page="playlists"><span>Playlists</span><span class="mono" id="nav-pl"></span></a>
      <a href="#/device" data-page="device"><span>Player</span><span class="mono"></span></a>
    </nav>
    <div class="side-foot">Paste a link, it lands on the player.<br>Plug in with USB or join Wi-Fi.</div>
  </aside>
  <main><div id="view"></div></main>
</div>

<footer class="player off" id="player">
  <div class="now">
    <div class="cover lg" id="p-cover"></div>
    <div class="meta"><div class="title" id="p-title">Nothing playing</div><div class="artist" id="p-artist">Connect your JJMP3 via USB</div></div>
  </div>
  <div class="transport">
    <div class="ctl">
      <button class="icon-btn" id="p-shuffle" title="Shuffle"></button>
      <button class="icon-btn" id="p-prev" title="Previous"></button>
      <button class="play-btn" id="p-play" title="Play / pause"></button>
      <button class="icon-btn" id="p-next" title="Next"></button>
      <button class="icon-btn" id="p-repeat" title="Repeat"></button>
    </div>
    <div class="seek"><span class="mono" id="p-pos">0:00</span><div class="rail" id="p-rail"><div><i id="p-fill"></i></div></div><span class="mono" id="p-dur">0:00</span></div>
  </div>
  <div class="right"><span id="p-vol-icon"></span><input type="range" id="p-vol" min="0" max="100" value="60"></div>
</footer>

<dialog id="dialog"></dialog>
<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
